<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eye Health Assistant · ChakshuRakshakAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0C1024;--teal:#22B7A3;--teal-d:#1a9088;--coral:#F6815E;
    --offwhite:#F8F7F5;--white:#FFFFFF;--g100:#F0F1F5;--g200:#DDE0EA;--g300:#BCC0D2;
    --g400:#9096B0;--g500:#6B7090;--g600:#4A5070;--red:#F35858;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--offwhite);color:var(--navy);display:flex;justify-content:center;}
  .chat{display:flex;flex-direction:column;width:100%;max-width:760px;height:100%;background:var(--white);border-left:1px solid var(--g200);border-right:1px solid var(--g200);}

  /* Header */
  .head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--g200);background:var(--white);}
  .logo{width:36px;height:36px;border-radius:50%;background:rgba(34,183,163,.12);display:grid;place-items:center;flex:none;}
  .head-text{flex:1;min-width:0;}
  .head-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .head-sub{font-size:11.5px;color:var(--g500);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;}
  .head-sub i{width:7px;height:7px;border-radius:50%;background:#38CC87;display:inline-block;}
  .head-actions{display:flex;align-items:center;gap:8px;flex:none;}
  /* Straight to a clinic search, without having to ask for one first. */
  .find{display:inline-flex;align-items:center;gap:6px;font:600 12px 'Inter',sans-serif;color:var(--teal-d);background:rgba(34,183,163,.1);border:1px solid rgba(34,183,163,.32);border-radius:20px;padding:0 12px;height:34px;text-decoration:none;white-space:nowrap;transition:background .15s;}
  .find:hover{background:rgba(34,183,163,.2);}
  .find:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .find svg{flex:none;}
  .lang{display:flex;background:var(--g100);border-radius:10px;padding:3px;flex:none;}
  .lang button{font:600 12px 'Inter',sans-serif;border:none;background:none;color:var(--g500);padding:0 10px;height:28px;border-radius:8px;cursor:pointer;transition:color .15s;}
  .lang button.on{background:var(--white);color:var(--navy);box-shadow:0 1px 3px rgba(12,16,36,.12);}
  .lang button:hover:not(.on){color:var(--navy);}
  .lang button:focus-visible{outline:2px solid var(--teal);outline-offset:1px;}
  .close{display:none;border:none;background:none;font-size:22px;line-height:1;color:var(--g500);cursor:pointer;padding:4px 6px;}
  body.embedded .close{display:block;}

  /* Messages */
  .msgs{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;}
  .row{display:flex;gap:8px;max-width:88%;}
  .row.user{align-self:flex-end;flex-direction:row-reverse;}
  .avatar{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(34,183,163,.12);margin-top:2px;}
  .row.user .avatar{display:none;}
  .bubble{padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.6;word-wrap:break-word;overflow-wrap:anywhere;}
  .row.bot .bubble{background:var(--g100);border-top-left-radius:6px;}
  .row.user .bubble{background:var(--teal);color:var(--white);border-top-right-radius:6px;}
  .row.err .bubble{background:rgba(243,88,88,.08);color:#A12F2F;}
  .bubble img.att{display:block;max-width:220px;max-height:220px;border-radius:10px;margin-bottom:6px;}
  .bubble p{margin:0 0 8px;} .bubble p:last-child{margin-bottom:0;}
  .bubble ul,.bubble ol{margin:4px 0 8px 18px;} .bubble li{margin:2px 0;}
  .bubble strong{font-weight:700;}
  .clinic{display:inline-flex;align-items:center;gap:7px;margin-top:10px;font:700 13px 'Inter',sans-serif;color:var(--white);background:var(--navy);border-radius:10px;padding:10px 14px;text-decoration:none;}
  .clinic:hover{background:#1A2344;}
  .typing{display:inline-flex;gap:4px;padding:4px 2px;}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--g400);animation:blink 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 4px 36px;}
  .chip{font:500 12.5px 'Inter',sans-serif;color:var(--teal-d);background:var(--white);border:1px solid rgba(34,183,163,.4);border-radius:20px;padding:7px 12px;cursor:pointer;}
  .chip:hover{background:rgba(34,183,163,.06);}

  /* Composer: the message gets the full width, the controls sit on their own line
     underneath, so neither crowds the other. */
  .composer{border-top:1px solid var(--g200);padding:12px 14px 14px;background:var(--white);}
  .preview{display:none;align-items:center;gap:10px;background:var(--g100);border-radius:12px;padding:7px 9px;margin-bottom:9px;font-size:12px;color:var(--g600);}
  .preview.show{display:flex;}
  .preview img{width:42px;height:42px;object-fit:cover;border-radius:8px;}
  .preview span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .preview button{border:none;background:none;font-size:18px;color:var(--g500);cursor:pointer;padding:0 6px;border-radius:6px;}
  .preview button:hover{background:var(--g200);color:var(--navy);}
  .bar{background:var(--offwhite);border:1.5px solid var(--g200);border-radius:18px;padding:10px 12px 8px;transition:border-color .15s,box-shadow .15s;}
  .bar:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(34,183,163,.14);background:var(--white);}
  textarea{display:block;width:100%;resize:none;border:none;background:none;outline:none;font:400 15px/1.55 'Inter',sans-serif;color:var(--navy);max-height:150px;padding:2px 2px 0;}
  textarea::placeholder{color:var(--g400);}
  .tools{display:flex;align-items:center;gap:4px;margin-top:4px;}
  .tools .spacer{flex:1;}
  .hint{font-size:11px;color:var(--g400);margin-right:8px;white-space:nowrap;}
  .icon{width:40px;height:40px;flex:none;border:none;background:none;border-radius:12px;display:grid;place-items:center;color:var(--g500);cursor:pointer;transition:background .15s,color .15s;}
  .icon:hover{background:var(--g200);color:var(--navy);}
  .icon:focus-visible{outline:2px solid var(--teal);outline-offset:1px;}
  .icon:disabled{opacity:.4;cursor:not-allowed;}
  .icon.listening{background:rgba(243,88,88,.12);color:var(--red);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(243,88,88,.45);}70%{box-shadow:0 0 0 8px rgba(243,88,88,0);}100%{box-shadow:0 0 0 0 rgba(243,88,88,0);}}
  .send{width:44px;height:44px;flex:none;border:none;border-radius:50%;background:var(--teal);color:var(--white);display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .1s;}
  .send:hover:enabled{background:var(--teal-d);}
  .send:active:enabled{transform:scale(.94);}
  .send:focus-visible{outline:2px solid var(--teal-d);outline-offset:2px;}
  .send:disabled{background:var(--g200);color:var(--g400);cursor:not-allowed;}
  .send svg{margin-left:-2px;}
  .foot{font-size:10.5px;color:var(--g400);text-align:center;margin-top:9px;line-height:1.5;}
  /* The widget panel is 400px wide wherever it is embedded, so the pin goes label-less
     there and keeps its name through aria-label; the full-page view is wide enough. */
  @media (max-width:430px){.hint{display:none;}.find span{display:none;}.find{padding:0 9px;}}
  @media (prefers-reduced-motion:reduce){.typing i,.icon.listening,.send{animation:none;transition:none;}}
</style>
</head>
<body>
<div class="chat">
  <header class="head">
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 36 36"><path d="M27 9 A12 12 0 1 0 27 27" fill="none" stroke="#0C1024" stroke-width="3.5" stroke-linecap="round"/><circle cx="19" cy="18" r="4" fill="#22B7A3"/></svg>
    </div>
    <div class="head-text">
      <div class="head-title">Eye Health Assistant</div>
      <div class="head-sub"><i></i>ChakshuRakshakAI · AI, not a doctor</div>
    </div>
    <div class="head-actions">
      <a class="find" href="https://www.google.com/maps/search/eye+hospital+OR+ophthalmologist+OR+retina+clinic+near+me/" target="_blank" rel="noopener" aria-label="Find an eye clinic near you" title="Find an eye hospital, ophthalmologist or retina clinic near you">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>Find a clinic</span>
      </a>
      <div class="lang" role="group" aria-label="Answer language">
        <button type="button" data-lang="auto" class="on" title="Answer in whichever language you write in">Auto</button>
        <button type="button" data-lang="en" title="Always answer in English">EN</button>
        <button type="button" data-lang="hi" title="हमेशा हिंदी में जवाब">हिं</button>
      </div>
    </div>
    <button class="close" type="button" aria-label="Close chat" onclick="parent.postMessage({type:'chakshu-chat-close'},'*')">×</button>
  </header>

  <main class="msgs" id="msgs" aria-live="polite"></main>

  <footer class="composer">
    <div class="preview" id="preview">
      <img id="preview-img" alt="">
      <span id="preview-name"></span>
      <button type="button" aria-label="Remove image" onclick="clearImage()">×</button>
    </div>
    <div class="bar">
      <textarea id="input" rows="1" placeholder="Ask about your eyes… / अपनी आँखों के बारे में पूछें…" aria-label="Message"></textarea>
      <div class="tools">
        <button class="icon" id="attach" type="button" title="Attach a fundus or OCT image" aria-label="Attach image">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="file" accept="image/*" hidden>
        <button class="icon" id="mic" type="button" title="Speak" aria-label="Speak your question">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/></svg>
        </button>
        <span class="spacer"></span>
        <span class="hint">Enter to send</span>
        <button class="send" id="send" type="button" aria-label="Send" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </div>
    <div class="foot">For information only — not a diagnosis. Always consult a certified ophthalmologist.</div>
  </footer>
</div>

<script>
'use strict';

// The page is served from the website; the API is the workstation backend behind ngrok.
const API_URL = 'https://survive-carving-clinking.ngrok-free.dev/api/chat';
// The same answer, sent as it is written. Generation runs at a few tokens a second on a
// GPU shared with training, so this is the difference between waiting half a minute and
// reading along from the second word.
const STREAM_URL = API_URL + '/stream';
const HEADERS = { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1' };
const MAX_SIDE = 2048;             // downscale larger images before upload
const HISTORY_TURNS = 12;          // earlier messages sent back for context
const CLINIC_URL = 'https://www.google.com/maps/search/eye+clinic+near+me/';
const CLINIC_WORDS = /doctor|clinic|डॉक्टर|क्लिनिक/i;

const $ = id => document.getElementById(id);
const msgs = $('msgs'), input = $('input'), sendBtn = $('send'), micBtn = $('mic');
let image = null;                  // { dataUrl, name }
let history = [];                  // [{ role: 'user'|'model', text }]
let busy = false;
let answerLang = 'auto';           // 'auto' | 'en' | 'hi' - picked in the header
let speechLang = 'en-US';          // what the microphone listens for

if (window.self !== window.top) document.body.classList.add('embedded');

// ── Rendering ─────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// A small, safe Markdown subset: the text is escaped first, then **bold**, *italic*,
// headings, and bulleted / numbered lists are turned into HTML.
function md(text) {
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  const out = []; let list = null;
  const close = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  esc(text).split('\n').forEach(line => {
    const t = line.trim();
    let m;
    if (!t) { close(); return; }
    if ((m = t.match(/^[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
    if ((m = t.match(/^\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
    close();
    if ((m = t.match(/^#{1,6}\s+(.*)/))) { out.push('<p><strong>' + inline(m[1]) + '</strong></p>'); return; }
    out.push('<p>' + inline(t) + '</p>');
  });
  close();
  return out.join('');
}

const BOT_ICON = '<svg width="16" height="16" viewBox="0 0 36 36"><path d="M27 9 A12 12 0 1 0 27 27" fill="none" stroke="#0C1024" stroke-width="3.5" stroke-linecap="round"/><circle cx="19" cy="18" r="4" fill="#22B7A3"/></svg>';

function addRow(kind, html) {
  const row = document.createElement('div');
  row.className = 'row ' + kind;
  row.innerHTML = '<div class="avatar" aria-hidden="true">' + BOT_ICON + '</div><div class="bubble">' + html + '</div>';
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return row;
}

function addBot(text) {
  let html = md(text);
  if (CLINIC_WORDS.test(text)) {
    html += '<a class="clinic" href="' + CLINIC_URL + '" target="_blank" rel="noopener">📍 Find Eye Clinics Near Me</a>';
  }
  return addRow('bot', html);
}

function welcome() {
  addRow('bot', md('**Namaste! I am the ChakshuRakshakAI eye-health assistant.**\n' +
    'Ask me about eye symptoms, diabetic eye care or a fundus / OCT image — type, speak, or attach an image.\n' +
    'आप हिंदी में भी पूछ सकते हैं।'));
  const chips = document.createElement('div');
  chips.className = 'chips';
  ['What is diabetic retinopathy?', 'मेरी आँखें धुंधली दिखती हैं, क्या करूँ?', 'How often should a diabetic get an eye check?', 'What is macular edema?']
    .forEach(q => {
      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = q;
      b.onclick = () => { input.value = q; chips.remove(); send(); };
      chips.appendChild(b);
    });
  msgs.appendChild(chips);
}

// ── Sending ───────────────────────────────────────────────────────────────────

function refreshSend() { sendBtn.disabled = busy || (!input.value.trim() && !image); }

// Read the streamed answer, handing each piece to `onText` as the whole text so far.
async function streamReply(payload, onText) {
  const r = await fetch(STREAM_URL, { method: 'POST', headers: HEADERS, body: JSON.stringify(payload) });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.detail && typeof d.detail === 'string' ? d.detail : 'Something went wrong (' + r.status + ').');
  }
  if (!r.body || !r.body.getReader) throw new Error('no-stream');
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '', full = '', streamErr = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const line = buf.slice(0, i).split('\n').find(l => l.indexOf('data:') === 0);
      buf = buf.slice(i + 2);
      if (!line) continue;
      let d;
      try { d = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
      if (d.delta) { full += d.delta; onText(full); }
      else if (d.error) streamErr = d.error;
    }
  }
  if (!full && streamErr) throw new Error(streamErr);
  return full;
}

// The whole answer in one response. Used when streaming is not available.
async function plainReply(payload) {
  const r = await fetch(API_URL, { method: 'POST', headers: HEADERS, body: JSON.stringify(payload) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail && typeof d.detail === 'string' ? d.detail : 'Something went wrong (' + r.status + ').');
  return d.reply || '';
}

async function send() {
  const text = input.value.trim();
  if (busy || (!text && !image)) return;
  busy = true; refreshSend();
  // the message is on its way: stop dictating into the box it just emptied
  if (recognition && wantListening) { wantListening = false; recognition.stop(); }
  document.querySelectorAll('.chips').forEach(c => c.remove());

  addRow('user', (image ? '<img class="att" src="' + image.dataUrl + '" alt="Attached image">' : '') + (text ? md(text) : ''));
  const payload = { message: text, history: history.slice(-HISTORY_TURNS) };
  if (answerLang !== 'auto') payload.lang = answerLang;
  if (image) payload.image = image.dataUrl;
  input.value = ''; autoGrow(); clearImage();

  const typing = addRow('bot', '<span class="typing"><i></i><i></i><i></i></span>');
  let bubble = null;
  // The first piece of text replaces the typing dots; later ones rewrite the bubble.
  const onText = sofar => {
    if (!bubble) { typing.remove(); bubble = addRow('bot', '').querySelector('.bubble'); }
    bubble.innerHTML = md(sofar);
    msgs.scrollTop = msgs.scrollHeight;
  };

  try {
    let reply;
    try {
      reply = await streamReply(payload, onText);
    } catch (e) {
      if (bubble) throw e;                 // part of the answer is already on screen
      reply = await plainReply(payload);   // nothing shown yet: ask for it in one piece
    }
    if (!reply) throw new Error('The assistant did not answer. Please try again.');
    if (bubble) {
      if (CLINIC_WORDS.test(reply)) {
        bubble.insertAdjacentHTML('beforeend',
          '<a class="clinic" href="' + CLINIC_URL + '" target="_blank" rel="noopener">&#128205; Find Eye Clinics Near Me</a>');
      }
    } else {
      typing.remove();
      addBot(reply);
    }
    history.push({ role: 'user', text: text || '[shared an eye image]' }, { role: 'model', text: reply });
  } catch (e) {
    if (!bubble) typing.remove();
    addRow('err', esc(e.message || 'Could not reach the assistant. Check your connection and try again.'));
  }
  busy = false; refreshSend(); input.focus();
}
sendBtn.onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
function autoGrow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
input.addEventListener('input', () => { autoGrow(); refreshSend(); });

// ── Image attachment ──────────────────────────────────────────────────────────

$('attach').onclick = () => $('file').click();
$('file').onchange = e => { const f = e.target.files[0]; if (f) attach(f); e.target.value = ''; };

// Read the image as a data URL; scale very large photos down so uploads stay small.
function attach(file) {
  if (!file.type.startsWith('image/')) { addRow('err', 'Please attach an image file (fundus or OCT scan).'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      let dataUrl = reader.result;
      const k = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      if (k < 1 || file.size > 4 * 1024 * 1024 || !/^image\/(jpeg|png|webp)$/.test(file.type)) {
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        dataUrl = c.toDataURL('image/jpeg', 0.9);
      }
      image = { dataUrl, name: file.name };
      $('preview-img').src = dataUrl; $('preview-name').textContent = file.name;
      $('preview').classList.add('show'); refreshSend();
    };
    img.onerror = () => addRow('err', 'This image could not be opened. Try a JPG or PNG.');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function clearImage() { image = null; $('preview').classList.remove('show'); $('preview-img').removeAttribute('src'); refreshSend(); }

// ── Voice input (Web Speech API) ──────────────────────────────────────────────

// The picked language drives both the answer and what the microphone listens for.
// 'auto' leaves the answer to follow whatever language the question was written in.
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  answerLang = b.dataset.lang;
  speechLang = answerLang === 'hi' ? 'hi-IN' : 'en-US';
  document.querySelectorAll('.lang button').forEach(x => {
    const on = x === b;
    x.classList.toggle('on', on);
    x.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  if (recognition) recognition.lang = speechLang;
});

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, listening = false, wantListening = false, baseText = '', finalText = '';
if (!SR) {
  micBtn.disabled = true;
  micBtn.title = 'Voice input is not supported in this browser (try Chrome or Edge).';
} else {
  recognition = new SR();
  recognition.lang = speechLang;
  recognition.interimResults = true;
  // Keep the microphone open until it is switched off. The browser still ends its own
  // session on a pause, so onend starts a fresh one while the user still wants to talk.
  recognition.continuous = true;
  recognition.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    const said = (finalText + interim).trim();
    input.value = (baseText ? baseText + ' ' : '') + said;
    autoGrow(); refreshSend();
  };
  recognition.onerror = e => {
    // A silence ('no-speech') or a restart ('aborted') is normal; onend picks it up again.
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      wantListening = false;
      addRow('err', 'Microphone permission was denied. Allow the microphone to use voice input.');
    }
  };
  recognition.onend = () => {
    if (wantListening) {
      try { recognition.start(); return; } catch (e) { /* could not resume: fall through */ }
    }
    wantListening = false;
    listening = false;
    micBtn.classList.remove('listening');
    micBtn.title = 'Speak';
  };
  micBtn.onclick = () => {
    if (wantListening) { wantListening = false; recognition.stop(); return; }
    baseText = input.value.trim();
    finalText = '';
    wantListening = true;
    try {
      recognition.lang = speechLang;
      recognition.start();
      listening = true;
      micBtn.classList.add('listening');
      micBtn.title = 'Listening… tap to stop';
    } catch (e) { wantListening = false; }
  };
}
welcome();
</script>
</body>
</html>
